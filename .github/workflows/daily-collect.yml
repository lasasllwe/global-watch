name: Daily collect

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 06:00 Singapore
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect headlines
        run: python -m globalwatch collect
        env:
          PYTHONPATH: src
      - name: Commit new data
        run: |
          git config user.name "global-watch-bot"
          git config user.email "global-watch-bot@users.noreply.github.com"
          git add data/raw
          git diff --staged --quiet || git commit -m "data: daily collect $(date -u +%F)"
          git push
