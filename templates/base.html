<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Global Watch{% endblock %}</title>
  <meta name="description" content="A weekly, AI-assisted brief on world affairs that shows how different regions frame the same story.">
  <link rel="stylesheet" href="{{ root }}/style.css">
</head>
<body>
<div class="topbar"><div class="wrap">
  <a class="brand" href="{{ root }}/index.html"><span class="dots"><i></i><i></i><i></i><i></i><i></i><i></i></span>Global Watch</a>
  <nav><a href="{{ root }}/index.html">Briefs</a><a href="{{ root }}/methodology.html">Method &amp; sources</a></nav>
</div></div>
{% block hero %}{% endblock %}
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer><div class="wrap">
  Summaries are generated by an AI model from public headlines and may contain errors. Always check the linked original articles.<br>
  Built by Elsa Le Roy · <a href="https://github.com/lasasllwe/global-watch">Source code on GitHub</a>
</div></footer>
</body>
</html>
