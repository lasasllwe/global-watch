<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Global Watch{% endblock %}</title>
  <meta name="description" content="A weekly, AI-assisted brief on world affairs that shows how different regions frame the same story.">
  <link rel="stylesheet" href="{{ root }}/style.css">
</head>
<body>
<header>
  <a class="brand" href="{{ root }}/index.html">Global Watch</a>
  <nav><a href="{{ root }}/index.html">Weekly briefs</a><a href="{{ root }}/methodology.html">Method &amp; sources</a></nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  Summaries are generated by an AI model from public headlines and may contain errors. Always check the linked original articles.
  Built by Elsa Le Roy · <a href="https://github.com/lasasllwe/global-watch">Source code on GitHub</a>
</footer>
</body>
</html>
